<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <pattern id="weave" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#22304a"/>
      <path d="M0 9h18M9 0v18" stroke="#2b3a57" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1000" height="1000" fill="url(#weave)"/>
  <!-- 交叉鱼骨纹，热点居中 450,480 120x90 -->
  <g stroke="#f4ead5" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M300 525 L600 435 M300 435 L600 525"/>
    <g>
      <path d="M360 507 l-28 -16 M360 453 l-28 16 M430 486 l-28 -16 M430 474 l-28 16
               M500 465 l-28 -16 M500 495 l-28 16 M560 447 l-24 -14 M560 513 l-24 14"/>
    </g>
  </g>
  <!-- 裁切线外（左侧 ~90,500）的针脚标记 -->
  <g stroke="#c9a86a" stroke-width="6" stroke-linecap="round">
    <path d="M70 470 l40 60 M110 470 l-40 60"/>
  </g>
  <rect x="200" y="200" width="600" height="600" fill="none" stroke="#d9c7a3"
        stroke-width="3" stroke-dasharray="14 10" opacity="0.8"/>
  <text x="210" y="190" fill="#d9c7a3" font-family="serif" font-size="26">裁切框 / crop</text>
</svg>
